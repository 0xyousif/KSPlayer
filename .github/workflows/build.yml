on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  build:
    name: Build iOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@main
        with:
          submodules: recursive

      - name: Set up Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Build iOS
        run: |
          xcodebuild \
            -scheme KSPlayer \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/KSPlayer.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Create IPA
        run: |
          mkdir -p build/Payload
          cp -R build/KSPlayer.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r KSPlayer.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KSPlayer-iOS
          path: build/KSPlayer.ipa
